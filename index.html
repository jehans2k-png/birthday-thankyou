<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080714">
<title>A Surprise for You</title>
<style>
:root { --lavender:#d9b8ff; --pink:#ff9acb; --ink:#080714; }
* { box-sizing:border-box; }
body {
  margin:0; min-height:100vh; overflow:hidden; color:#fff;
  display:grid; place-items:center; padding:22px;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(ellipse at 15% 15%,rgba(128,76,190,.30),transparent 38%),
    radial-gradient(ellipse at 85% 85%,rgba(66,90,173,.25),transparent 40%),
    linear-gradient(145deg,#080714,#17102c 55%,#080714);
}
#stars,.sparkles { position:fixed; inset:0; overflow:hidden; pointer-events:none; }
.star {
  position:absolute; width:3px; height:3px; border-radius:50%;
  background:#fff; opacity:.2; box-shadow:0 0 9px #d9b8ff;
  animation:twinkle 2.5s ease-in-out infinite alternate;
}
@keyframes twinkle { to { opacity:1; transform:scale(1.8); } }
.screen { width:min(100%,430px); text-align:center; position:relative; z-index:2; }
.intro { animation:arrive .9s ease both; }
@keyframes arrive { from{opacity:0;transform:translateY(22px) scale(.96)} to{opacity:1;transform:none} }
.eyebrow { color:#cdb0f5; font-size:10px; letter-spacing:.38em; font-weight:700; margin:0 0 18px; }
.intro h1 { font-family:Georgia,serif; font-weight:400; font-size:clamp(30px,8vw,42px); line-height:1.18; margin:0 0 12px; }
.intro p { color:#c9bfdc; font-size:14px; line-height:1.6; margin:0 0 28px; }
.envelope-wrap { width:210px; height:150px; margin:0 auto 28px; position:relative; filter:drop-shadow(0 15px 24px rgba(0,0,0,.35)); }
.envelope {
  position:absolute; inset:28px 0 0; border-radius:9px;
  background:linear-gradient(145deg,#8e62bd,#563c88);
  overflow:visible;
}
.envelope:before,.envelope:after {
  content:""; position:absolute; bottom:0; width:0; height:0; border-style:solid;
}
.envelope:before { left:0; border-width:0 105px 82px 0; border-color:transparent transparent #7650a7 transparent; }
.envelope:after { right:0; border-width:0 0 82px 105px; border-color:transparent transparent #674693 transparent; }
.flap {
  position:absolute; top:0; left:0; width:0; height:0; z-index:3;
  border-left:105px solid transparent; border-right:105px solid transparent;
  border-top:78px solid #b58bdf; transform-origin:top; transition:transform .75s ease;
}
.letter {
  position:absolute; z-index:2; left:17px; right:17px; top:13px; height:105px;
  border-radius:5px; background:#fff7ff; color:#68418d;
  display:grid; place-items:center; font-size:27px;
  transition:transform .8s cubic-bezier(.2,.8,.2,1);
}
.seal {
  position:absolute; z-index:4; left:50%; top:55px; transform:translateX(-50%);
  width:34px; height:34px; border-radius:50%; display:grid; place-items:center;
  background:#f5b4d8; color:#733c76; font-size:17px; box-shadow:0 0 15px #f5b4d8;
}
.opening .flap { transform:rotateX(180deg); }
.opening .letter { transform:translateY(-76px); }
button {
  border:1px solid rgba(230,203,255,.75); border-radius:999px;
  padding:14px 25px; color:#170d2b; font-weight:700; letter-spacing:.04em;
  background:linear-gradient(100deg,#f0c9ff,#ffb9dc);
  box-shadow:0 0 24px rgba(211,157,255,.28);
  cursor:pointer; font-size:14px; transition:transform .2s,box-shadow .2s;
}
button:active { transform:scale(.97); }
.hint { margin-top:14px!important; font-size:11px!important; color:#9f91b7!important; }
.card {
  display:none; opacity:0; transform:translateY(18px) scale(.97);
  padding:42px 27px 34px; border-radius:28px;
  border:1px solid rgba(218,184,255,.7);
  background:linear-gradient(145deg,rgba(37,24,61,.92),rgba(12,10,27,.94));
  box-shadow:0 0 38px rgba(163,105,231,.22),inset 0 0 30px rgba(216,180,254,.05);
}
.card.show { display:block; animation:reveal .9s .1s ease forwards; }
@keyframes reveal { to {opacity:1;transform:translateY(0) scale(1)} }
.card .eyebrow { margin-bottom:22px; }
.card h2 {
  margin:0 0 19px; font-size:clamp(34px,9vw,46px);
  color:#fff; text-shadow:0 0 18px rgba(217,184,255,.55);
}
.main-message { margin:0 auto; max-width:320px; color:#f5eaff; font:21px/1.6 Georgia,serif; }
.sub-message { margin:15px 0 0; color:#c9b7df; font-size:13px; line-height:1.6; }
.heart { margin:22px 0 0; font-size:25px; color:#ff9acb; animation:pulse 1.4s infinite; }
@keyframes pulse { 50%{transform:scale(1.25);text-shadow:0 0 18px #ff9acb} }
.signature { margin:24px 0 0; color:#d9b8ff; letter-spacing:.35em; font-size:11px; font-weight:700; }
#replay { margin-top:25px; background:transparent; color:#e9d9ff; box-shadow:none; font-size:12px; padding:10px 18px; }
.float {
  position:absolute; bottom:-30px; color:#e7c9ff; opacity:0;
  animation:floatUp linear forwards; pointer-events:none;
}
@keyframes floatUp { 10%{opacity:.8} 100%{transform:translateY(-110vh) rotate(220deg);opacity:0} }
@media (prefers-reduced-motion:reduce) {
  *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; }
}
</style>
</head>
<body>
<div id="stars" aria-hidden="true"></div>
<div class="sparkles" id="sparkles" aria-hidden="true"></div>

<main class="screen">
  <section class="intro" id="intro">
    <p class="eyebrow">✦ A LITTLE SURPRISE ✦</p>
    <h1>Someone sent you<br>something special</h1>
    <p>A small note, wrapped just for you.</p>

    <div class="envelope-wrap" id="envelope">
      <div class="envelope"></div>
      <div class="letter">♡</div>
      <div class="flap"></div>
      <div class="seal">✦</div>
    </div>

    <button id="openButton" type="button">OPEN YOUR SURPRISE ✧</button>
    <p class="hint">Tap the button to open your note</p>
  </section>

  <section class="card" id="card" aria-live="polite">
    <p class="eyebrow">✦ A LITTLE NOTE ✦</p>
    <h2>Thank You! <span style="color:#ff9acb">♡</span></h2>
    <p class="main-message">Thank you for remembering my special day.</p>
    <p class="sub-message">Your wishes made my day even more special.</p>
    <div class="heart" aria-hidden="true">♥</div>
    <p class="signature">— JEHAN</p>
    <button id="replay" type="button">↻ WATCH AGAIN</button>
  </section>
</main>

<script>
const stars = document.getElementById("stars");
for (let i=0; i<65; i++) {
  const s=document.createElement("i");
  s.className="star";
  s.style.left=Math.random()*100+"%";
  s.style.top=Math.random()*100+"%";
  s.style.animationDelay=(Math.random()*3)+"s";
  s.style.animationDuration=(1.5+Math.random()*3)+"s";
  stars.appendChild(s);
}
const intro=document.getElementById("intro");
const card=document.getElementById("card");
const envelope=document.getElementById("envelope");
const openButton=document.getElementById("openButton");

function burst() {
  const symbols=["✦","✧","♡","·"];
  for(let i=0;i<24;i++){
    const f=document.createElement("span");
    f.className="float";
    f.textContent=symbols[Math.floor(Math.random()*symbols.length)];
    f.style.left=Math.random()*100+"vw";
    f.style.fontSize=(12+Math.random()*17)+"px";
    f.style.animationDuration=(3.5+Math.random()*3)+"s";
    document.getElementById("sparkles").appendChild(f);
    setTimeout(()=>f.remove(),7000);
  }
}
function openNote(){
  openButton.disabled=true;
  envelope.classList.add("opening");
  intro.classList.add("opening");
  setTimeout(()=>{
    intro.style.display="none";
    card.classList.add("show");
    burst();
  },850);
}
openButton.addEventListener("click",openNote);
document.getElementById("replay").addEventListener("click",()=>{
  card.classList.remove("show");
  card.style.display="none";
  intro.style.display="block";
  intro.classList.remove("opening");
  envelope.classList.remove("opening");
  openButton.disabled=false;
});
</script>
</body>
</html>
